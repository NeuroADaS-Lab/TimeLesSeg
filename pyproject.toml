[project]
name = "TimeLesSeg"
version = "0.0-dev"
requires-python = ">=3.12"
description = "Multiple Sclerosis Lesion Segmentation CNN-based tool unifying cross-sectional and longitudinal processing."
readme = "Readme.md"
authors = [
    {name = "Vicent Caselles-Ballester", email = "vcasellesb@uoc.edu"}
]

dependencies = [
   "batchgeneratorsv2@git+https://github.com/vcasellesb/batchgeneratorsv2.git#egg=dev",
   "numpy",
   "scipy",
   "scikit-image",
   "pyyaml",
   "SimpleITK",
   "nibabel",
   "tqdm"
]


[tool.setuptools.packages.find]
include = ["timelesseg*"]